name: Temporary SDK bootstrap
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Package .NET 10 SDK
        shell: bash
        run: |
          cd "$DOTNET_ROOT"
          sdk="$(dotnet --version)"
          runtime="$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^10\./ { print $2 }' | sort -V | tail -1)"
          tar -I 'gzip -1' -cf /tmp/dotnet-sdk.tar.gz dotnet "host/fxr/$runtime" "sdk/$sdk" "shared/Microsoft.NETCore.App/$runtime" "packs/Microsoft.NETCore.App.Ref/$runtime" "packs/Microsoft.AspNetCore.App.Ref/$runtime" "packs/Microsoft.NETCore.App.Host.linux-x64/$runtime"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: temporary-dotnet-sdk
          path: /tmp/dotnet-sdk.tar.gz
          compression-level: 0
          retention-days: 1
