name: Temporary SDK bootstrap
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - run: tar -C "$DOTNET_ROOT" -czf /tmp/dotnet-sdk.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: temporary-dotnet-sdk
          path: /tmp/dotnet-sdk.tar.gz
          retention-days: 1
