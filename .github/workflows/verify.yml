name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and test portable ledger core
        run: dotnet run --project tests/ResourceLedger.Tests.csproj -c Release -p:NuGetAudit=false -- --benchmark
      - name: Verify stale-build rejection
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Verify translations, icons and prebuilt assemblies
        run: python tools/verify.py --prebuilt
      - name: Package installable mod and source
        run: python tools/package.py --prebuilt --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ResourceLedger-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ResourceLedger-release
          path: dist
      - name: Publish a new version after verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          version=$(python -c "import xml.etree.ElementTree as E; print(E.parse('Directory.Build.props').findtext('.//Version'))")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; existing releases are preserved."
          else
            gh release create "$tag" dist/* --target "$COMMIT_SHA" --title "Resource Ledger $version" --notes-file docs/RELEASE_NOTES.md --prerelease
          fi
